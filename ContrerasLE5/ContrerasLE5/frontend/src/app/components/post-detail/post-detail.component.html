<div class="detail-container">

  <div class="post-card" *ngIf="post">

    <div class="post-header">
      <h1>{{ post.title }}</h1>

      <p class="post-info">
        By <span>{{ post.firstName }} {{ post.lastName }}</span>
        <span class="separator">•</span>
        {{ post.dateCreated | date:'medium' }}
      </p>
    </div>

    <div class="post-body">
      <p>{{ post.body }}</p>
    </div>

    <div class="post-footer">
      <span>Post ID: {{ post.id }}</span>
    </div>

    <div class="button-container">
      <button
        class="back-button"
        type="button"
        routerLink="/">
        Back to Posts
      </button>
    </div>

  </div>

</div>
